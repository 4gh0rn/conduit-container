name: Conduit Deployment

on:
  push:
    branches: [main, github_ci_deployment]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/4gh0rn/conduit-backend
  FRONTEND_IMAGE: ghcr.io/4gh0rn/conduit-frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./conduit-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./conduit-frontend
          push: true
          build-args: |
            FRONTEND_API_URL=${{ vars.FRONTEND_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_TAG: ${{ github.sha }}
      BACKEND_PORT: ${{ vars.BACKEND_PORT }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
      BACKEND_DB_PATH: ${{ vars.BACKEND_DB_PATH }}
      BACKEND_LOG_LEVEL: ${{ vars.BACKEND_LOG_LEVEL }}
      DEBUG: ${{ vars.DEBUG }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy prod compose and deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          source: "compose.prod.yml,scripts/deploy_prod.sh"
          target: ${{ vars.DEPLOY_PATH || '~/conduit-container' }}

      - name: Deploy (no build on VM)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: IMAGE_TAG,BACKEND_PORT,FRONTEND_PORT,BACKEND_DB_PATH,BACKEND_LOG_LEVEL,DEBUG,ALLOWED_HOSTS,CORS_ALLOW_ORIGINS,SECRET_KEY,DEPLOY_PATH,GHCR_USERNAME,GHCR_PAT
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-${HOME}/conduit-container}"
            chmod +x "${DEPLOY_PATH}/scripts/deploy_prod.sh"
            "${DEPLOY_PATH}/scripts/deploy_prod.sh"
