name: Deploy Conduit Container

on:
  push:
    branches: [create_deployment]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || 22 }}
          TARGET: ${{ vars.DEPLOY_PATH || '~/conduit-container' }}
          EXCLUDE: ".git/, .github/, *.md, .env"
          SCRIPT_AFTER: |
            cd ${{ vars.DEPLOY_PATH || '~/conduit-container' }}

            # Export environment variables for Docker Compose
            export BACKEND_PORT=${{ vars.BACKEND_PORT }}
            export BACKEND_DB_PATH=${{ vars.BACKEND_DB_PATH }}
            export BACKEND_LOG_LEVEL=${{ vars.BACKEND_LOG_LEVEL }}
            export FRONTEND_PORT=${{ vars.FRONTEND_PORT }}
            export FRONTEND_PORT_INTERNAL=${{ vars.FRONTEND_PORT_INTERNAL }}
            export FRONTEND_API_URL=${{ vars.FRONTEND_API_URL }}
            export CORS_ALLOW_ORIGINS=${{ vars.CORS_ALLOW_ORIGINS || '*' }}
            export ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS || '*' }}
            export DEBUG=${{ vars.DEBUG || 'False' }}

            # Add secret key if provided
            if [ -n "${{ secrets.DJANGO_SECRET_KEY }}" ]; then
              export SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            fi

            # Deploy with Docker Compose
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo "Stopping and removing all containers, networks, and volumes..."
            $COMPOSE_CMD down --volumes --remove-orphans || true

            echo "Cleaning up Docker system completely..."
            docker builder prune -af || true
            docker system prune -af --volumes || true

            echo "Restarting Docker service for clean slate..."
            sudo systemctl restart docker || true
            sleep 5

            echo "Building and starting containers with fresh environment..."
            $COMPOSE_CMD build --pull --no-cache
            $COMPOSE_CMD up -d

            echo "Waiting for services..."
            sleep 10

            echo "Creating missing profiles for existing users..."
            $COMPOSE_CMD exec -T backend python manage.py create_missing_profiles || true

            echo "Container status:"
            $COMPOSE_CMD ps

            # Health check
            if curl -f http://localhost:${{ vars.BACKEND_PORT }}/api/health; then
              echo "Deployment successful!"
            else
              echo "Health check failed!"
              $COMPOSE_CMD logs backend | tail -20
              exit 1
            fi
