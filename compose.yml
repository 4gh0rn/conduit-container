services:
  backend:
    build:
      context: ./conduit-backend
      dockerfile: Dockerfile
    container_name: conduit-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - BACKEND_DB_PATH=${BACKEND_DB_PATH:-/app/data/conduit.db}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-info}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DEBUG=${DEBUG:-False}
    volumes:
      - backend-db:/app/data
    networks:
      - conduit-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./conduit-frontend
      dockerfile: Dockerfile
    container_name: conduit-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8282}:${FRONTEND_PORT_INTERNAL:-4173}"
    environment:
      - FRONTEND_API_URL=${FRONTEND_API_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - conduit-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4173/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  conduit-network:
    driver: bridge
    name: conduit-network

volumes:
  backend-db:
    name: conduit-backend-db
